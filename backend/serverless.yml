service: chatbot-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    STAGE: ${self:provider.stage}
    # Add other environment variables as needed
    # OPENAI_API_KEY: ${env:OPENAI_API_KEY}

functions:
  chat:
    handler: src/lambda/chat-handler.handler
    events:
      - http:
          path: chat
          method: post
          cors:
            # Security Hardening: Origin whitelisting
            # Replace with your production domain(s)
            # Removed wildcard usage. Only specific domains are allowed.
            origins:
              - 'https://your-website.com'
              - 'https://www.your-website.com'
              - 'http://localhost:3000'
            headers:
              - Content-Type
              - Authorization
              - X-Requested-With
            allowCredentials: true

package:
  individually: true
  patterns:
    - 'src/**'
    - 'node_modules/**'
    - '!package-lock.json'

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 4000
    lambdaPort: 4002